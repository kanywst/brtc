# Hardware hashrate baselines.
#
# Each profile lists hashes-per-second under realistic offline-attack
# conditions, the hourly rental cost in USD, and a citation. When a
# baseline is updated, bump `last_reviewed` to today and replace the
# `source` URL if a newer benchmark is now authoritative.
#
# Conventions:
#   bcrypt   baseline is at cost = 5 (the hashcat mode-3200 reference point).
#            CalculateHashRate divides by 2^(workFactor-5) at runtime.
#   argon2id baseline is at t = 1, m = 64MB, p = 1.
#            CalculateHashRate divides linearly by workFactor and by the
#            memory ratio at runtime. Argon2 GPU throughput is memory-bound
#            and parameter-dependent (no clean per-GPU published figure), so
#            these baselines are modeled, not measured.
#   cost_per_hour_usd = 0 means "owned hardware" (no rental cost).
#
# 2026 modeling note: password cracking is 32-bit integer/bitwise work, not
# tensor work, so consumer GPUs (RTX 5090/4090) are BOTH faster and far more
# cost-efficient at cracking than datacenter AI GPUs (H100/H200). A realistic
# attacker rents 4090/5090 on Vast.ai/RunPod/Salad at ~$0.20-0.80/GPU-hr, not
# an $40/hr 8x-H100 box. The aws-p5.48xlarge profile is kept for comparison
# but is deliberately cost-inefficient for this workload.

profiles:

  rtx-5090:
    name: "NVIDIA RTX 5090 (Blackwell, current top cracker)"
    cost_per_hour_usd: 0.30
    hashrates:
      md5: 220600000000
      sha1: 70200000000
      sha256: 28350000000
      ntlm: 340100000000
      bcrypt: 304800
      argon2id: 1340
    source: "https://gist.github.com/Chick3nman/09bac0775e6393468c2925c1e1363d5c (hashcat, 2025-2026)"
    last_reviewed: "2026-07-19"

