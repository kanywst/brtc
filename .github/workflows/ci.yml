name: CI pipeline

on:
  push:
    branches: [ "main" ]
    # The VHS workflow pushes a regenerated gif to main and there is nothing
    # for CI to check in it. Skipping it here is what lets that commit drop
    # its [skip ci] marker, which silently killed a release: a tag landing on
    # a commit whose message carries the marker skips every workflow for the
    # tag push too, including this repo's release.
    paths-ignore:
      - 'assets/demo.gif'
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-test:
    name: Build, Test, and Lint
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7

    - name: Set up Go
      uses: actions/setup-go@v7
      with:
        # go.mod's toolchain line: the Go release.yml builds the shipped
        # binaries with, so the tests and the govulncheck scan below cover the
        # stdlib that actually ships. A floating '1.26' here hid that releases
        # were built with go1.25.0. The toolchain has to stay >= 1.26, because
        # golang.org/x/vuln v1.8.0 requires it and setup-go sets
        # GOTOOLCHAIN=local, so an older one cannot fetch a newer one.
        go-version-file: go.mod
        cache: true

    - name: Install dependencies
      run: go mod download

    - name: Run golangci-lint
      uses: golangci/golangci-lint-action@v9
      with:
        version: v2.10.1
        args: --timeout=5m

    - name: Run govulncheck
      # Runs on the Go set up above. golang/govulncheck-action is avoided
      # on purpose: its bundled setup-go ignores the toolchain directive and
      # defaults to "stable", so it would scan a stdlib the release never
      # ships.
      run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...

    - name: Build
      run: go build -v ./...

    - name: Test
      run: go test -v -race -cover ./...
