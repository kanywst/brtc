name: CI pipeline

on:
  push:
    branches: [ "main" ]
    # The VHS workflow pushes a regenerated gif to main and there is nothing
    # for CI to check in it. Skipping it here is what lets that commit drop
    # its [skip ci] marker, which silently killed a release: a tag landing on
    # a commit whose message carries the marker skips every workflow for the
    # tag push too, including this repo's release.
    paths-ignore:
      - 'assets/demo.gif'
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-test:
    name: Build, Test, and Lint
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7

    - name: Set up Go
      uses: actions/setup-go@v7
      with:
        go-version: '1.25'
        # Without this, setup-go reuses whatever 1.25.x the runner image ships,
        # which lags the security releases. govulncheck then reports stdlib
        # vulnerabilities that are already fixed upstream and CI fails on a
        # stale toolchain rather than on anything in the diff.
        check-latest: true
        cache: true

    - name: Install dependencies
      run: go mod download

    - name: Run golangci-lint
      uses: golangci/golangci-lint-action@v9
      with:
        version: v2.10.1
        args: --timeout=5m

    - name: Run govulncheck
      run: |
        go install golang.org/x/vuln/cmd/govulncheck@latest
        govulncheck ./...

    - name: Build
      run: go build -v ./...

    - name: Test
      run: go test -v -race -cover ./...
