name: VHS demo

on:
  pull_request:
    paths:
      - assets/demo.tape
      - "**/*.go"
      - go.mod
      - go.sum
      - .github/workflows/vhs.yml
  push:
    branches: [main]
    paths:
      - assets/demo.tape
      - "**/*.go"
      - go.mod
      - go.sum
      - .github/workflows/vhs.yml
  workflow_dispatch:

permissions:
  contents: read

# Serialize runs per ref so two gif regenerations never reach the push step
# at the same time. Without this, both render a (possibly differing) binary
# and the loser's rebase conflicts on assets/demo.gif, which git cannot
# 3-way-merge. Queued rather than cancel-in-progress: a run for an older
# commit still yields a valid gif, and cancelling it would leave main
# carrying whichever gif happened to win the race.
concurrency:
  group: vhs-${{ github.ref }}
  cancel-in-progress: false

jobs:
  generate:
    name: Render demo.gif
    runs-on: ubuntu-latest
    permissions:
      # write needed only on the main-branch commit step. Pull-request
      # runs from forks intentionally fall through to the artifact path.
      contents: write
    steps:
      - uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: "1.25"
          cache: true

      - name: Build brtc binary
        run: go build -o brtc .

      - name: Render VHS tape
        # Run VHS via its official Docker image rather than vhs-action.
        # vhs-action@v2's embedded ffmpeg installer is unreliable on
        # ubuntu-latest. The Charm-published image bundles ttyd, ffmpeg,
        # and fonts.
        #
        # --ipc=host: VHS internally drives headless Chrome. With Docker's
        # default 64MB shared memory, Chrome crashes with
        # "chrome_crashpad_handler: --database is required" before any
        # frame is captured. Sharing the host IPC namespace gives Chrome
        # enough shm to render. Drop the --user override because the
        # image's ttyd/chrome bits expect the in-image user; ownership of
        # the produced gif is fixed up via sudo chown after the run.
        run: |
          docker run --rm \
            --ipc=host \
            -v "$PWD:/vhs" \
            -w /vhs \
            ghcr.io/charmbracelet/vhs:latest \
            assets/demo.tape
          sudo chown -R "$(id -u):$(id -g)" assets/

      - name: Upload preview (pull request)
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@v7
        with:
          name: demo-gif
          path: assets/demo.gif
          if-no-files-found: error

      - name: Commit regenerated gif (main)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          set -euo pipefail
          if git diff --quiet -- assets/demo.gif; then
            echo "demo.gif unchanged; nothing to commit."
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/demo.gif
          git commit -m "chore(demo): regenerate VHS gif [skip ci]"
          # A merge that does not match this workflow's path filters (a
          # docs-only one, say) can still land between checkout and this
          # push and reject it as non-fast-forward. The concurrency group
          # above rules out the other VHS run as the cause, so the new tip
          # does not touch assets/demo.gif and the rebase applies cleanly.
          for attempt in 1 2 3; do
            if push_err=$(git push 2>&1); then
              exit 0
            fi
            echo "$push_err"
            case "$push_err" in
              # Both reasons appear on the ref-status line, e.g.
              #   ! [rejected]  main -> main (fetch first)
              # Git's longer "behind its remote counterpart" advice is not
              # matched: it is wrapped across two hint: lines, so it never
              # occurs as a contiguous substring.
              *"non-fast-forward"*|*"fetch first"*) ;;
              *)
                # Branch protection, a revoked token, anything else: retrying
                # cannot fix it, and three more rebases only add noise.
                echo "push failed for a reason a retry cannot fix" >&2
                exit 1
                ;;
            esac
            echo "push rejected (attempt $attempt), rebasing onto origin/main"
            if ! pull_err=$(git pull --rebase origin main 2>&1); then
              echo "$pull_err"
              # A pull can fail without any conflict at all — a network
              # blip, a rate limit, an auth hiccup. Those must not report
              # success, or a stale gif on main looks like a green run that
              # blames a concurrent job. Only unmerged paths mean a real
              # conflict.
              if git ls-files --unmerged | grep -q .; then
                git rebase --abort || true
                # Reachable only if the concurrency guard is bypassed. The
                # conflict means another run already pushed a regenerated
                # gif, so main is current either way — say so and stop
                # rather than failing the branch over a demo gif.
                echo "rebase conflicted on assets/demo.gif; a concurrent run already pushed one"
                exit 0
              fi
              git rebase --abort 2>/dev/null || true
              echo "could not rebase onto origin/main" >&2
              exit 1
            fi
          done
          echo "could not push the regenerated gif after 3 attempts" >&2
          exit 1
