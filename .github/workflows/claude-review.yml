name: Claude review

# CI answers "does it build and do the tests pass". This asks the question no
# script here can. It reviews, it does not gate: nothing here is a required
# check.
#
# The action refuses to run when this file differs from the copy on the default
# branch, so a pull request cannot rewrite its own reviewer. The cost is that
# any change to this file, including the one that added it, goes unreviewed by
# Claude until it is merged.

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions: {}

# One review per pull request. A rapid re-push cancels the run it superseded
# rather than paying for a review of a diff that no longer exists.
concurrency:
  group: claude-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    # A pull request from a fork gets no secrets, so the job would fail on
    # authentication rather than say anything useful. Dependabot is the same
    # problem wearing a different hat: its pull requests run against the
    # Dependabot secret store, where this token does not exist. A version bump
    # is also the one diff that has nothing for a reviewer to say. Drafts are
    # skipped until they are marked ready, which is what the ready_for_review
    # trigger is for.
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.draft == false &&
      github.event.pull_request.user.login != 'dependabot[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      pull-requests: write
      # Required by the action's default GitHub App authentication.
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      # Without the secret the action exits successfully having reviewed
      # nothing, which is worse than failing: the check goes green and the
      # pull request looks reviewed. Fail here instead, where the reason is
      # legible.
      - name: Require the token
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: |
          if [ -z "$CLAUDE_CODE_OAUTH_TOKEN" ]; then
            echo "::error::CLAUDE_CODE_OAUTH_TOKEN is not set. Generate one with 'claude setup-token', then: gh secret set CLAUDE_CODE_OAUTH_TOKEN"
            exit 1
          fi

      - uses: anthropics/claude-code-action@a874e9ecd7bb36efdad65429c6b35815f5a08f10 # v1
        with:
          # A subscription token, not an API key: runs against the Claude plan
          # instead of API credits. Generate it with `claude setup-token`.
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: |
            REPO: ${{ github.repository }}
            PR: ${{ github.event.pull_request.number }}

            brtc converts a password's guess count into the time and USD cost of an offline
            attack against a chosen GPU or cloud profile. It is deliberately a cost
            calculator, not a strength meter. Optional flags swap in zxcvbn for
            pattern-aware guessing and check Have I Been Pwned.

            Do not repeat what CI already does. Build, test and lint run on this PR already.

            Look for what only a reader can catch:

            1. Anything leaving the machine. The HIBP lookup is k-anonymous: only the first
               five characters of the SHA-1 go out. A change that sends more of the hash, or
               the password itself, anywhere is the most serious defect possible here.

            2. Passwords in output. Logs, error messages, telemetry, JSON and SARIF must
               never carry the input.

            3. The exit-code contract. `--fail-under-time` makes exit codes an API, and
               brtc-action depends on them. A gate that stops failing lets weak secrets
               through, which fails silently and in the dangerous direction.

            4. Machine-readable output. JSON and SARIF are consumed by other tools, so a
               renamed or removed field is a breaking change even though nothing here
               notices.

            5. Calibration. Hardware profiles and hash rates track 2026 hashcat baselines.
               Changing a constant changes every user's verdict, so it needs a stated
               source.

            6. Arithmetic at the extremes. Overflow and precision for argon2id on a
               Raspberry Pi, or a very long passphrase, rather than the typical case.

            Post findings as inline comments on the lines they concern. Use one
            top-level comment for the summary. Be specific and cite
            `file:line`. If the diff is clean against all of the above, say so
            in one line rather than manufacturing nits.

          claude_args: |
            --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*)"
