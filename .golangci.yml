version: "2"

run:
  timeout: 5m
  issues-exit-code: 1
  go: "1.25"

linters:
  enable:
    - errcheck
    - govet
    - ineffassign
    - misspell
    - revive
    - staticcheck
    - unconvert
    - unused
  settings:
    revive:
      rules:
        # Don't force godoc-style WHAT comments on every exported symbol;
        # this repo prefers WHY-only comments. Keep the rest of revive on.
        - name: exported
          disabled: true
        - name: package-comments
          disabled: true

formatters:
  enable:
    - gofmt
    - goimports
