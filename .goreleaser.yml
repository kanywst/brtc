version: 2

project_name: brtc

before:
  hooks:
    - go mod tidy

builds:
  - id: brtc
    binary: brtc
    main: ./
    goos:
      - darwin
      - linux
    goarch:
      - amd64
      - arm64
    env:
      - CGO_ENABLED=0
    ldflags:
      - -s -w
      - -X github.com/kanywst/brtc/cmd.version={{ .Version }}

archives:
  - formats:
      - tar.gz
    name_template: "{{ .ProjectName }}-{{ .Version }}-{{ .Os }}-{{ .Arch }}"
    files:
      - LICENSE
      - README.md

checksum:
  name_template: "{{ .ProjectName }}-{{ .Version }}-checksums.txt"

release:
  prerelease: auto
  # Lets a partially-failed release be re-run. Without this, re-uploading an
  # asset that is already on the release fails with a 422 and goreleaser aborts
  # before it gets to the Homebrew step.
  replace_existing_artifacts: true

homebrew_casks:
  - name: brtc
    binaries:
      - brtc
    homepage: "https://github.com/kanywst/brtc"
    description: "Cost calculator for offline password brute-force attacks"
    repository:
      owner: kanywst
      name: homebrew-tap
      branch: main
      token: "{{ .Env.HOMEBREW_TAP_GITHUB_TOKEN }}"
    directory: Casks
    commit_author:
      name: goreleaserbot
      email: bot@goreleaser.com
    commit_msg_template: "chore(cask): {{ .ProjectName }} {{ .Tag }}"

sboms:
  - artifacts: archive

# cosign 3.x removed --output-certificate and --output-signature outright and
# writes a Sigstore bundle instead, so the signature and the certificate ship
# together in one .sigstore.json rather than a separate .sig + .pem pair.
signs:
  - cmd: cosign
    signature: "${artifact}.sigstore.json"
    args:
      - "sign-blob"
      - "--bundle=${signature}"
      - "${artifact}"
      - "--yes"
    artifacts: checksum
    output: true

nfpms:
  - maintainer: kanywst
    description: Cost calculator for offline password brute-force attacks
    homepage: https://github.com/kanywst/brtc
    license: MIT
    formats:
      - deb
      - rpm
