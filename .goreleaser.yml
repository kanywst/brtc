version: 2

project_name: brtc

before:
  hooks:
    - go mod tidy

builds:
  - id: brtc
    binary: brtc
    main: ./
    goos:
      - darwin
      - linux
    goarch:
      - amd64
      - arm64
    env:
      - CGO_ENABLED=0
    ldflags:
      - -s -w
      - -X github.com/kanywst/brtc/v2/cmd.version={{ .Version }}

archives:
  - formats:
      - tar.gz
    name_template: "{{ .ProjectName }}-{{ .Version }}-{{ .Os }}-{{ .Arch }}"
    files:
      - LICENSE
      - README.md

checksum:
  name_template: "{{ .ProjectName }}-{{ .Version }}-checksums.txt"

release:
  prerelease: auto
  # Lets a partially-failed release be re-run. Without this, re-uploading an
  # asset that is already on the release fails with a 422 and goreleaser aborts
  # before it gets to the Homebrew step.
  replace_existing_artifacts: true

homebrew_casks:
  - name: brtc
    binaries:
      - brtc
    # Without this, `brew install kanywst/tap/brtc` produces a binary that
    # deletes itself the first time it is run. Homebrew stages the cask's
    # tarball with com.apple.quarantine set; the binary is not signed with an
    # Apple Developer ID, so on first exec Gatekeeper kills it AND removes the
    # file, leaving /opt/homebrew/bin/brtc dangling at a path that no longer
    # exists. `brew install` still reports success, so nothing looks wrong
    # until the user runs it. Reproduced on macOS 26 / Homebrew 5, arm64:
    # present before exec, gone after, with LICENSE and README.md left behind.
    #
    # The real fix is signing and notarising with an Apple Developer ID, which
    # costs $99/year. Until then, strip the quarantine bit on install, which is
    # what GoReleaser's own documentation recommends for this case and what the
    # sibling y509 cask in the same tap already does.
    hooks:
      post:
        install: |
          if OS.mac?
            system_command "/usr/bin/xattr", args: ["-dr", "com.apple.quarantine", "#{staged_path}/brtc"]
          end
    homepage: "https://github.com/kanywst/brtc"
    description: "Cost calculator for offline password brute-force attacks"
    repository:
      owner: kanywst
      name: homebrew-tap
      branch: main
      token: "{{ .Env.HOMEBREW_TAP_GITHUB_TOKEN }}"
    directory: Casks
    commit_author:
      name: goreleaserbot
      email: bot@goreleaser.com
    commit_msg_template: "chore(cask): {{ .ProjectName }} {{ .Tag }}"

sboms:
  - artifacts: archive

# cosign 3.x removed --output-certificate and --output-signature outright and
# writes a Sigstore bundle instead, so the signature and the certificate ship
# together in one .sigstore.json rather than a separate .sig + .pem pair.
signs:
  - cmd: cosign
    signature: "${artifact}.sigstore.json"
    args:
      - "sign-blob"
      - "--bundle=${signature}"
      - "${artifact}"
      - "--yes"
    artifacts: checksum
    output: true

nfpms:
  - maintainer: kanywst
    description: Cost calculator for offline password brute-force attacks
    homepage: https://github.com/kanywst/brtc
    license: MIT
    formats:
      - deb
      - rpm
